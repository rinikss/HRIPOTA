<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>УСЛУГИ</title>
    <link href="./stylesheets/style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="custom-cursor"></div>
    <section class="menubar">
      <a href="./index.html"><img src="" alt="logo" /></a>
      <div>
        <div class="list_container"></div>
        <ul class="li-list">
          <li><a href="about.html">О НАС</a></li>
          <li><a href="services.html">УСЛУГИ</a></li>
          <li><a href="contacts.html">КОНТАКТЫ</a></li>
          <li><a href="affiche.html">АФИША</a></li>
          <li><a href="merch.html">МЕРЧ</a></li>
        </ul>
      </div>
    </section>
    <div class="btn">
      <div class="circle"></div>
      <div class="btn_text">присоединяйся к нам</div>
    </div>
    <div class="form">
      <div class="content">
        <div class="close_circle"></div>

        <p class="form_title">
          Хочешь к нам?<br />Напиши пару слов о себе и своей музыке.<br />Мы не
          кусаемся и не навязываем лишнего.
        </p>

        <div class="form_row">
          <div class="form_field">
            <label class="form_label">имя</label>
            <input class="form_input" type="text" placeholder="" />
          </div>

          <div class="form_field form_field_phone">
            <label class="form_label">номер телефона</label>
            <div class="form_phone_wrap">
              <span class="form_phone_code">+7</span>
              <input
                class="form_input form_input_phone"
                type="tel"
                placeholder=""
              />
            </div>
          </div>
        </div>

        <div class="form_field">
          <label class="form_label">немного о тебе</label>
          <textarea class="form_textarea" rows="4"></textarea>
        </div>

        <div class="form_field">
          <label class="form_label">ссылка на твою музыку</label>
          <input class="form_input" type="url" placeholder="" />
        </div>

        <button class="form_submit">Отправить заявку</button>
      </div>
    </div>

    <section class="basement"></section>
    <canvas class="grain"></canvas>
    <script src="javascripts/java-script.js" charset="utf-8"></script>
    <script src="./javascripts/transition.js"></script>
  </body>
</html>
